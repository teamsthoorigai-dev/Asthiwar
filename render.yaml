databases:
  - name: asthiwar-db
    databaseName: asthiwar
    user: asthiwar
    plan: free

services:
  - type: web
    name: asthiwar-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:backend
    startCommand: npm run db:setup && npm --workspace=backend run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: asthiwar-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
