databases:
  - name: asthiwar-db
    databaseName: asthiwar
    user: asthiwar
    plan: free

services:
  - type: web
    name: asthiwar-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:backend
    startCommand: npm run db:setup && npm --workspace=backend run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: asthiwar-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # Optional. With no admin account, the first start creates one — ADMIN_SEED_EMAIL
      # (default admin@asthiwar.com) with ADMIN_SEED_PASSWORD, or with a random password
      # printed once in the deploy log. An account still on the default password
      # published in the source is moved onto ADMIN_SEED_PASSWORD when that is set.
      - key: ADMIN_SEED_EMAIL
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
      # Same value as API_PROXY_SECRET on the Vercel project. Lets rate limits see
      # each visitor's IP instead of Vercel's. At least 32 characters.
      - key: API_PROXY_SECRET
        sync: false
